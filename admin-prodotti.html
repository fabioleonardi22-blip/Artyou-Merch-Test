<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artyou Merch — Prodotti</title><link rel="stylesheet" href="admin.css"><style>
.catalog-layout{display:grid;grid-template-columns:310px 1fr;gap:20px}.catalog-list,.editor{background:#fff;border:1px solid #e4e1da;border-radius:8px;padding:16px}.proditem{padding:12px;border:1px solid #e6e3dd;border-radius:7px;margin:8px 0;cursor:pointer}.proditem.active{border:2px solid #f39a05;background:#fff9ee}.proditem b{display:block}.proditem small{color:#777}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{background:#f1efea;border-radius:20px;padding:7px 10px;font-size:12px}.chip button{border:0;background:none;color:#d44;margin-left:5px}.variant-table input{width:64px;padding:6px;border:1px solid #ccc;border-radius:4px}.image-preview{width:150px;height:150px;object-fit:cover;border-radius:8px;background:#eee}.actionsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.danger{border-color:#e2b7b7!important;color:#b82f35}.hint{font-size:12px;color:#777;line-height:1.45}.empty{padding:25px;text-align:center;color:#777}@media(max-width:850px){.catalog-layout,.editorgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<header class="top"><img src="https://raw.githubusercontent.com/fabioleonardi22-blip/Artyoubeta26091001/main/img/logo-orizzontale-bianco.png"><a class="trial" href="/">Prova gratis</a><span class="burger">☰</span></header><div class="redline"></div><nav class="site-nav"><span>CORSI</span><span>Improvvisazione</span><span>Corsi Amatoriali</span><span>Corsi Professionali</span><span>Workshop</span><span>Spettacoli</span><span>Festival e altro</span><span>Chi siamo</span></nav>
<div class="shell"><aside class="side"><a href="admin.html"><span class="ico">⌂</span>Panoramica</a><a class="active" href="admin-prodotti.html"><span class="ico">▱</span>Prodotti</a><a href="admin-magazzino.html"><span class="ico">▣</span>Magazzino</a><a href="admin-ordini.html"><span class="ico">▦</span>Ordini</a><a href="admin-clienti.html"><span class="ico">♧</span>Clienti</a><a href="#"><span class="ico">⚙</span>Impostazioni</a><a class="exit" href="/"><span class="ico">↪</span>Esci</a></aside>
<main class="main"><div class="bar"><div><div class="small">Merch Artyou</div><h1>Prodotti e modelli</h1></div><button class="btn orange" onclick="newProduct()">＋ Nuovo prodotto / modello</button></div>
<div class="catalog-layout"><section class="catalog-list"><b>Catalogo</b><p class="hint">Ogni modello può avere colori, taglie e quantità indipendenti.</p><div id="list"></div></section><section class="editor" id="editor"></section></div></main></div>
<script src="catalog.js"></script><script>
let catalog=ArtyouCatalog.getCatalog(),current=catalog[0]?.id;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderList(){document.getElementById("list").innerHTML=catalog.map(p=>`<div class="proditem ${p.id===current?"active":""}" onclick="selectProduct('${p.id}')"><b>${esc(p.name)} · ${esc(p.model)}</b><small>${esc(p.category)} · €${Number(p.price).toFixed(2).replace(".",",")} · ${ArtyouCatalog.totalStock(p)} pezzi</small></div>`).join("")||'<div class="empty">Nessun prodotto.</div>'}
function selectProduct(id){current=id;render()}
function newProduct(){let p={id:ArtyouCatalog.slug("nuovo"),name:"Nuovo prodotto",model:"Nuovo modello",category:"T-shirt",price:20,active:true,image:"",colors:["Nero"],sizes:["S","M","L","XL"],stock:{"Nero|S":0,"Nero|M":0,"Nero|L":0,"Nero|XL":0}};catalog.unshift(p);current=p.id;save();render()}
function render(){renderList();let p=catalog.find(x=>x.id===current);if(!p){document.getElementById("editor").innerHTML='<div class="empty">Crea un prodotto per iniziare.</div>';return}
document.getElementById("editor").innerHTML=`<div class="editorgrid">
<div class="field"><label>Nome prodotto</label><input id="name" value="${esc(p.name)}"></div><div class="field"><label>Modello</label><input id="model" value="${esc(p.model)}" placeholder="es. Classic, Oversize, Donna"></div>
<div class="field"><label>Categoria</label><select id="category"><option>T-shirt</option><option>Felpe</option><option>Pantaloni</option><option>Calzini</option><option>Accessori</option></select></div><div class="field"><label>Prezzo (€)</label><input id="price" type="number" step=".5" value="${p.price}"></div>
<div class="field wide"><label>URL immagine prodotto</label><input id="image" value="${esc(p.image||"")}" placeholder="https://..."></div>
<div><img class="image-preview" src="${esc(p.image||"")}" onerror="this.style.visibility='hidden'"></div><div><label style="font-size:11px;font-weight:700">Prodotto online</label><div class="switchrow"><input id="active" type="checkbox" ${p.active?"checked":""}> <span>Attivo e visibile nello shop</span></div></div>
<div class="wide"><hr><b>Colori</b><div class="chips">${p.colors.map((c,i)=>`<span class="chip">${esc(c)}<button onclick="removeColor(${i})">×</button></span>`).join("")}</div><div class="tools" style="padding:0"><input id="newColor" class="search" placeholder="es. Bordeaux"><button class="btn" onclick="addColor()">＋ Colore</button></div></div>
<div class="wide"><b>Taglie</b><div class="chips">${p.sizes.map((s,i)=>`<span class="chip">${esc(s)}<button onclick="removeSize(${i})">×</button></span>`).join("")}</div><div class="tools" style="padding:0"><input id="newSize" class="search" placeholder="es. XXL oppure 40–43"><button class="btn" onclick="addSize()">＋ Taglia</button></div></div>
<div class="wide"><b>Varianti e disponibilità</b><p class="hint">Ogni combinazione colore × taglia ha una giacenza separata.</p><div style="overflow:auto"><table class="variant-table"><thead><tr><th>Colore</th><th>Taglia</th><th>Codice</th><th>Disponibilità</th></tr></thead><tbody>${p.colors.flatMap(c=>p.sizes.map(s=>{let k=c+"|"+s;return `<tr><td>${esc(c)}</td><td>${esc(s)}</td><td>${esc(p.id.toUpperCase().slice(0,8))}-${esc(c.slice(0,2).toUpperCase())}-${esc(s)}</td><td><input type="number" min="0" data-stock="${esc(k)}" value="${p.stock[k]||0}"></td></tr>`})).join("")}</tbody></table></div></div>
</div><div class="actionsrow"><button class="btn green" onclick="saveEditor()">Salva prodotto</button><button class="btn" onclick="duplicateProduct()">Duplica modello</button><button class="btn danger" onclick="deleteProduct()">Elimina</button></div>`;document.getElementById("category").value=p.category}
function syncFields(p){p.name=document.getElementById("name").value.trim()||"Prodotto";p.model=document.getElementById("model").value.trim()||"Modello";p.category=document.getElementById("category").value;p.price=Math.max(0,+document.getElementById("price").value||0);p.image=document.getElementById("image").value.trim();p.active=document.getElementById("active").checked;document.querySelectorAll("[data-stock]").forEach(x=>p.stock[x.dataset.stock]=Math.max(0,+x.value||0))}
function saveEditor(){let p=catalog.find(x=>x.id===current);syncFields(p);save();render();alert("Prodotto, varianti e disponibilità salvati.")}function save(){ArtyouCatalog.saveCatalog(catalog)}
function addColor(){let p=catalog.find(x=>x.id===current),v=document.getElementById("newColor").value.trim();if(v&&!p.colors.includes(v)){syncFields(p);p.colors.push(v);p.sizes.forEach(s=>p.stock[v+"|"+s]=0);save();render()}}
function addSize(){let p=catalog.find(x=>x.id===current),v=document.getElementById("newSize").value.trim();if(v&&!p.sizes.includes(v)){syncFields(p);p.sizes.push(v);p.colors.forEach(c=>p.stock[c+"|"+v]=0);save();render()}}
function removeColor(i){let p=catalog.find(x=>x.id===current);if(p.colors.length===1)return alert("Deve rimanere almeno un colore.");syncFields(p);let c=p.colors.splice(i,1)[0];Object.keys(p.stock).filter(k=>k.startsWith(c+"|")).forEach(k=>delete p.stock[k]);save();render()}
function removeSize(i){let p=catalog.find(x=>x.id===current);if(p.sizes.length===1)return alert("Deve rimanere almeno una taglia.");syncFields(p);let s=p.sizes.splice(i,1)[0];Object.keys(p.stock).filter(k=>k.endsWith("|"+s)).forEach(k=>delete p.stock[k]);save();render()}
function duplicateProduct(){let p=catalog.find(x=>x.id===current);syncFields(p);let n=JSON.parse(JSON.stringify(p));n.id=ArtyouCatalog.slug(p.name);n.model=p.model+" 2";Object.keys(n.stock).forEach(k=>n.stock[k]=0);catalog.unshift(n);current=n.id;save();render()}
function deleteProduct(){if(!confirm("Eliminare questo prodotto/modello?"))return;catalog=catalog.filter(x=>x.id!==current);current=catalog[0]?.id;save();render()}
render();
</script></body></html>
